<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sthefany XV Anos</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
  background:#000;
  width:100%;
  min-height:100%;
  font-family:Arial, sans-serif;
}

.tela{
  width:100%;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

#capa{
  cursor:pointer;
}

#capa img,
#convite img{
  width:100%;
  max-width:520px;
  height:auto;
  display:block;
}

#convite{
  display:none;
  position:relative;
}

#convite.ativo{
  display:flex;
}

#capa.sumir{
  display:none;
}

.convite-box{
  position:relative;
  width:100%;
  max-width:520px;
}

.botao{
  position:absolute;
  left:18%;
  width:64%;
  height:5.5%;
  z-index:10;
}

.confirmar{
  top:80.5%;
}

.localizacao{
  top:88.2%;
}
</style>
</head>

<body>

<section id="capa" class="tela">
  <img src="Capa.png" alt="Capa do convite">
</section>

<section id="convite" class="tela">
  <div class="convite-box">
    <img src="convite.png" alt="Convite Sthefany XV Anos">

    <a class="botao confirmar"
       href="https://meu.temfestinha.com/sthefany-batista12-2026"
       target="_blank"></a>

    <a class="botao localizacao"
       href="https://share.google/YCW9TYirK7uOsU898"
       target="_blank"></a>
  </div>
</section>

<script>
const capa = document.getElementById("capa");
const convite = document.getElementById("convite");

capa.addEventListener("click", function(){
  capa.classList.add("sumir");
  convite.classList.add("ativo");
  window.scrollTo(0,0);
});
</script>

</body>
</html>
