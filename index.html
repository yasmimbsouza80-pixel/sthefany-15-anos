<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sthefany XV Anos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow-x:hidden;
    font-family:Arial, sans-serif;
}

/* CAPA */

#capa{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    cursor:pointer;
}

#capa img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

/* CONVITE */

#convite{
    display:none;
    justify-content:center;
    background:#000;
    min-height:100vh;
}

#convite.ativo{
    display:flex;
}

.convite-box{
    position:relative;
    width:100%;
    max-width:520px;
}

.convite-box img{
    width:100%;
    display:block;
}

/* BOTÕES INVISÍVEIS */

.botao{
    position:absolute;
    z-index:999;
    display:block;
    cursor:pointer;

    
}

/* CONFIRMAR PRESENÇA */
.confirmar{
    left:14%;
    width:72%;
    height:6.5%;
    top:79.5%;
}

/* LOCALIZAÇÃO */
.localizacao{
    left:14%;
    width:72%;
    height:6.5%;
    top:88.2%;
}

</style>
</head>

<body>

<!-- CAPA -->

<section id="capa">
    <img src="Capa.png" alt="Capa">
</section>

<!-- CONVITE -->

<section id="convite">

    <div class="convite-box">

        <img src="convite5.png" alt="Convite">

        <!-- CONFIRMAR PRESENÇA -->
        <a
        class="botao confirmar"
        href="https://meu.temfestinha.com/sthefany-batista12-2026"
        target="_blank">
        </a>

        <!-- LOCALIZAÇÃO -->
        <a
        class="botao localizacao"
        href="https://share.google/YCW9TYirK7uOsU898"
        target="_blank">
        </a>

    </div>

</section>

<script>

const capa = document.getElementById("capa");
const convite = document.getElementById("convite");

capa.addEventListener("click", () => {

    capa.style.display = "none";
    convite.classList.add("ativo");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});

</script>

</body>
</html>
