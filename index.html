<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sthefany XV Anos</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  background:#000;
  font-family:Arial, sans-serif;
}

#capa{
  width:100vw;
  height:100vh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

#capa img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

#convite{
  display:none;
  background:#000;
  min-height:100vh;
  justify-content:center;
  align-items:flex-start;
}

#convite.ativo{
  display:flex;
}

.convite-box{
  position:relative;
  width:100%;
  max-width:520px;
}

.convite-box img{
  width:100%;
  display:block;
}

/* BOTÕES INVISÍVEIS */
.botao{
  position:absolute;
  left:20%;
  width:60%;
  height:5.5%;
  z-index:10;
}

/* Confirmar presença */
.confirmar{
  top:80.5%;
}

/* Ver localização */
.localizacao{
  top:88.3%;
}
</style>
</head>

<body>

<section id="capa">
  <img src="Capa.png" alt="Capa do convite">
</section>

<section id="convite">
  <div class="convite-box">

    <img src="convite4.png" alt="Convite Sthefany XV Anos">

    <a class="botao confirmar"
       href="https://meu.temfestinha.com/sthefany-batista12-2026"
       target="_blank"></a>

    <a class="botao localizacao"
       href="https://share.google/YCW9TYirK7uOsU898"
       target="_blank"></a>

  </div>
</section>

<script>
const capa = document.getElementById("capa");
const convite = document.getElementById("convite");

capa.addEventListener("click", () => {
  capa.style.display = "none";
  convite.classList.add("ativo");
  window.scrollTo(0, 0);
});
</script>

</body>
</html>
