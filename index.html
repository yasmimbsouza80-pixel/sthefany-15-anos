<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sthefany XV Anos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
}

.tela{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
transition:1s;
}

#capa{
background:url("Capa.png") center center;
background-size:cover;
cursor:pointer;
z-index:2;
}

#convite{
background:url("Convite.png") center center;
background-size:contain;
background-repeat:no-repeat;
background-color:#000;
opacity:0;
pointer-events:none;
z-index:1;
}

#convite.ativo{
opacity:1;
pointer-events:auto;
}

#capa.sumir{
opacity:0;
}

.botao{
position:absolute;
left:20%;
width:60%;
height:7%;
}

/* Confirmar Presença */
.confirmar{
top:78%;
}

/* Ver Localização */
.localizacao{
top:89%;
}
</style>
</head>

<body>

<div id="capa" class="tela"></div>

<div id="convite" class="tela">

<a
class="botao confirmar"
href="https://meu.temfestinha.com/sthefany-batista12-2026"
target="_blank">
</a>

<a
class="botao localizacao"
href="https://share.google/YCW9TYirK7uOsU898"
target="_blank">
</a>

</div>

<script>

const capa = document.getElementById("capa");
const convite = document.getElementById("convite");

capa.addEventListener("click", () => {

capa.classList.add("sumir");

setTimeout(() => {
convite.classList.add("ativo");
}, 500);

});

</script>

</body>
</html>
